          package teammod;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;

          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.*;

          public class TeamData {
              public static class Team {
                  public String name;
                  public int colorIndex;
                  public String leader;
                  public List<String> members = new ArrayList<>();
              }

              public Map<String, Team> teams = new LinkedHashMap<>();
              public Map<String, int[]> stats = new HashMap<>();   // uuid -> [kills, deaths]
              public Map<String, String> playerNames = new HashMap<>();
              public int nextColor = 0;

              private static TeamData data = new TeamData();
              /** Kurzzugriff auf die Namen-Map. */
              public static Map<String, String> names = data.playerNames;

              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();

              private static Path file() {
                  return FabricLoader.getInstance().getConfigDir().resolve("teammod-data.json");
              }

              public static void load() {
                  try {
                      Path f = file();
                      if (Files.exists(f)) {
                          TeamData d = GSON.fromJson(Files.readString(f), TeamData.class);
                          if (d != null) {
                              data = d;
                              if (data.playerNames == null) data.playerNames = new HashMap<>();
                              names = data.playerNames;
                          }
                      }
                  } catch (Exception e) {
                      System.err.println("[teammod] Daten konnten nicht geladen werden: " + e);
                  }
              }

              public static void save() {
                  try {
                      Files.writeString(file(), GSON.toJson(data));
                  } catch (Exception e) {
                      System.err.println("[teammod] Daten konnten nicht gespeichert werden: " + e);
                  }
              }

              public static Collection<Team> all() { return data.teams.values(); }

              public static Team find(String name) {
                  for (Team t : data.teams.values()) if (t.name.equalsIgnoreCase(name)) return t;
                  return null;
              }

              public static Team teamOf(UUID uuid) {
                  String id = uuid.toString();
                  for (Team t : data.teams.values()) if (t.members.contains(id)) return t;
                  return null;
              }

              public static boolean sameTeam(UUID a, UUID b) {
                  Team t = teamOf(a);
                  return t != null && t.members.contains(b.toString());
              }

              public static Team create(String name, UUID leader) {
                  Team t = new Team();
                  t.name = name;
                  t.colorIndex = data.nextColor++;
                  t.leader = leader.toString();
                  t.members.add(leader.toString());
                  data.teams.put(name.toLowerCase(), t);
                  save();
                  return t;
              }

              /** Entfernt den Spieler; loescht das Team, wenn es leer ist. Gibt das Team zurueck (oder null). */
              public static Team removeMember(UUID uuid) {
                  Team t = teamOf(uuid);
                  if (t == null) return null;
                  t.members.remove(uuid.toString());
                  if (t.members.isEmpty()) {
                      data.teams.remove(t.name.toLowerCase());
                  } else if (t.leader.equals(uuid.toString())) {
                      t.leader = t.members.get(0);
                  }
                  save();
                  return t;
              }

              public static int kills(UUID u) { return data.stats.getOrDefault(u.toString(), new int[2])[0]; }
              public static int deaths(UUID u) { return data.stats.getOrDefault(u.toString(), new int[2])[1]; }
              public static void addKill(UUID u) { data.stats.computeIfAbsent(u.toString(), k -> new int[2])[0]++; }
              public static void addDeath(UUID u) { data.stats.computeIfAbsent(u.toString(), k -> new int[2])[1]++; }
          }
