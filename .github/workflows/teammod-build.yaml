          package teammod.mixin;

          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.waypoints.WaypointTransmitter;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;
          import teammod.Locator;

          import java.util.Optional;

          /** Locator-Bar: blendet Spieler fuer einzelne Empfaenger aus. */
          @Mixin(LivingEntity.class)
          public abstract class LivingEntityMixin {
              @Inject(method = "makeWaypointConnectionWith", at = @At("HEAD"), cancellable = true)
              private void teammod$locator(ServerPlayer receiver,
                                           CallbackInfoReturnable<Optional<WaypointTransmitter.Connection>> cir) {
                  if ((Object) this instanceof ServerPlayer transmitter && !Locator.canSee(receiver, transmitter)) {
                      cir.setReturnValue(Optional.empty());
                  }
              }
          }
