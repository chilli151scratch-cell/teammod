          package teammod;

          import net.fabricmc.api.ModInitializer;
          import net.fabricmc.fabric.api.command.v2.CommandRegistrationCallback;
          import net.fabricmc.fabric.api.entity.event.v1.ServerLivingEntityEvents;
          import net.fabricmc.fabric.api.event.lifecycle.v1.ServerEntityEvents;
          import net.fabricmc.fabric.api.event.lifecycle.v1.ServerLifecycleEvents;
          import net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents;
          import net.fabricmc.fabric.api.networking.v1.ServerPlayConnectionEvents;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.world.entity.item.ItemEntity;

          public class TeamMod implements ModInitializer {
              public static final String MOD_ID = "teammod";

              @Override
              public void onInitialize() {
                  Config.load();
                  TeamData.load();

                  CommandRegistrationCallback.EVENT.register((dispatcher, registryAccess, env) -> {
                      TeamCommands.register(dispatcher);
                      GameFreeze.registerCommand(dispatcher);
                  });

                  ServerLifecycleEvents.SERVER_STARTED.register(Teams::syncAll);
                  ServerLifecycleEvents.SERVER_STOPPING.register(s -> TeamData.save());

                  ServerPlayConnectionEvents.JOIN.register((handler, sender, server) -> {
                      ServerPlayer p = handler.getPlayer();
                      TeamData.names.put(p.getUUID().toString(), p.getScoreboardName());
                      Teams.syncPlayer(server, p);
                      Teams.refreshTab(server);
                  });
                  ServerPlayConnectionEvents.DISCONNECT.register((handler, server) -> {
                      ServerPlayer p = handler.getPlayer();
                      Combat.onDisconnect(server, p);
                      Glow.remove(p);
                  });

                  // Kills und Deaths
                  ServerLivingEntityEvents.AFTER_DEATH.register((entity, source) -> {
                      if (entity instanceof ServerPlayer victim) {
                          TeamData.addDeath(victim.getUUID());
                          if (source.getEntity() instanceof ServerPlayer killer && killer != victim) {
                              TeamData.addKill(killer.getUUID());
                          }
                          Combat.clear(victim.getUUID());
                          TeamData.save();
                          Teams.refreshTab(victim.level().getServer());
                      }
                  });

                  // Combat-Logging: Treffer von Spieler zu Spieler
                  ServerLivingEntityEvents.AFTER_DAMAGE.register((entity, source, base, taken, blocked) -> {
                      if (entity instanceof ServerPlayer victim && source.getEntity() instanceof ServerPlayer attacker && attacker != victim) {
                          Combat.onHit(victim, attacker);
                      }
                  });

                  // Waehrend /gamefreeze kein Schaden fuer Nicht-OPs
                  ServerLivingEntityEvents.ALLOW_DAMAGE.register((entity, source, amount) ->
                          !(entity instanceof ServerPlayer p && GameFreeze.frozen && !Perm.isOp(p)));

                  // Verbotene Items am Boden loeschen
                  ServerEntityEvents.ENTITY_LOAD.register((entity, level) -> {
                      if (entity instanceof ItemEntity ie && ItemBan.isBanned(ie.getItem())) {
                          level.getServer().execute(ie::discard);
                      }
                  });

                  ServerTickEvents.END_SERVER_TICK.register(server -> {
                      Combat.tick(server);
                      Glow.tick(server);
                      GameFreeze.tick(server);
                      ItemBan.sweep(server);
                  });

                  GameFreeze.registerEvents();
              }
          }
