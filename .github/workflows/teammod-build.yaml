          package teammod.mixin;

          import net.minecraft.world.item.crafting.RecipeHolder;
          import net.minecraft.world.item.crafting.RecipeMap;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.ModifyVariable;
          import teammod.ItemBan;

          import java.util.ArrayList;
          import java.util.List;

          /** Filtert gesperrte Rezepte beim Laden heraus. */
          @Mixin(RecipeMap.class)
          public class RecipeMapMixin {
              @ModifyVariable(method = "create", at = @At("HEAD"), argsOnly = true)
              private static Iterable<RecipeHolder<?>> teammod$filter(Iterable<RecipeHolder<?>> in) {
                  List<RecipeHolder<?>> out = new ArrayList<>();
                  for (RecipeHolder<?> h : in) {
                      String id = ItemBan.recipeIdFromKey(h.id().toString());
                      if (!ItemBan.recipeBlocked(id)) out.add(h);
                  }
                  return out;
              }
          }
