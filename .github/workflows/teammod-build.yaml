          package teammod;

          import net.minecraft.ChatFormatting;
          import net.minecraft.network.chat.Component;
          import net.minecraft.network.chat.MutableComponent;
          import net.minecraft.network.protocol.game.ClientboundPlayerInfoUpdatePacket;
          import net.minecraft.server.MinecraftServer;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.world.scores.PlayerTeam;
          import net.minecraft.world.scores.Scoreboard;

          import java.util.EnumSet;

          public final class Teams {
              private Teams() {}

              public static final ChatFormatting[] COLORS = {
                      ChatFormatting.RED, ChatFormatting.BLUE, ChatFormatting.GREEN, ChatFormatting.YELLOW,
                      ChatFormatting.AQUA, ChatFormatting.LIGHT_PURPLE, ChatFormatting.GOLD, ChatFormatting.DARK_GREEN,
                      ChatFormatting.DARK_AQUA, ChatFormatting.DARK_PURPLE
              };

              public static ChatFormatting color(TeamData.Team t) {
                  return COLORS[t.colorIndex % COLORS.length];
              }

              private static PlayerTeam ensure(Scoreboard sb, TeamData.Team t) {
                  PlayerTeam pt = sb.getPlayerTeam("tm_" + t.name);
                  if (pt == null) pt = sb.addPlayerTeam("tm_" + t.name);
                  pt.setColor(color(t));
                  pt.setPlayerPrefix(Component.literal("[" + t.name + "] ").withStyle(color(t)));
                  return pt;
              }

              /** Setzt den Spieler (per Name) in das passende Scoreboard-Team. Das sortiert die Tab-Liste. */
              public static void sync(MinecraftServer server, String playerName, TeamData.Team t) {
                  Scoreboard sb = server.getScoreboard();
                  PlayerTeam cur = sb.getPlayersTeam(playerName);
                  String want = t == null ? null : "tm_" + t.name;
                  if (cur != null && cur.getName().startsWith("tm_") && !cur.getName().equals(want)) {
                      sb.removePlayerFromTeam(playerName, cur);
                      if (cur.getPlayers().isEmpty()) sb.removePlayerTeam(cur);
                      cur = null;
                  }
                  if (t != null) {
                      PlayerTeam pt = ensure(sb, t);
                      if (cur == null || !cur.getName().equals(want)) sb.addPlayerToTeam(playerName, pt);
                  }
              }

              public static void syncPlayer(MinecraftServer server, ServerPlayer p) {
                  sync(server, p.getScoreboardName(), TeamData.teamOf(p.getUUID()));
              }

              public static void syncAll(MinecraftServer server) {
                  for (TeamData.Team t : TeamData.all()) {
                      ensure(server.getScoreboard(), t);
                      for (String id : t.members) {
                          String n = TeamData.names.get(id);
                          if (n != null) sync(server, n, t);
                      }
                  }
              }

              /** Anzeigename in der Tab-Liste: [Team] Name  Totenkopf Deaths  Schwert Kills */
              public static Component tabName(ServerPlayer p) {
                  TeamData.Team t = TeamData.teamOf(p.getUUID());
                  ChatFormatting col = t == null ? ChatFormatting.WHITE : color(t);
                  MutableComponent c = Component.empty();
                  if (t != null) c.append(Component.literal("[" + t.name + "] ").withStyle(col));
                  c.append(Component.literal(p.getScoreboardName()).withStyle(col));
                  c.append(Component.literal("  \u2620 " + TeamData.deaths(p.getUUID())).withStyle(ChatFormatting.GRAY));
                  c.append(Component.literal("  \u2694 " + TeamData.kills(p.getUUID())).withStyle(ChatFormatting.GRAY));
                  return c;
              }

              public static void refreshTab(MinecraftServer server) {
                  if (server == null) return;
                  server.getPlayerList().broadcastAll(new ClientboundPlayerInfoUpdatePacket(
                          EnumSet.of(ClientboundPlayerInfoUpdatePacket.Action.UPDATE_DISPLAY_NAME),
                          server.getPlayerList().getPlayers()));
              }
          }
